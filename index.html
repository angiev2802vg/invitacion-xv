<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación XV Años - Regina Alejandra</title>
  <style>
    :root {
      --primary-color: #7e57c2;
      --secondary-color: #5e35b1;
      --bg-color: #f5f3ff;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 30px 24px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .guest-name {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--secondary-color);
      margin: 16px 0 4px 0;
    }

    .guest-passes {
      font-size: 1rem;
      color: #666;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background-color: #ede7f6;
      margin: 20px 0;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-confirm {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-confirm:hover {
      background-color: var(--secondary-color);
    }

    .btn-decline {
      background-color: #f3f4f6;
      color: #4b5563;
    }

    .btn-decline:hover {
      background-color: #e5e7eb;
    }

    .status-card {
      padding: 20px;
      border-radius: 12px;
      margin-top: 16px;
    }

    .status-confirmed {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .status-declined {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .loading-text {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Mis XV Años</h1>
    <h2 style="font-weight: 400; color: #555; margin-top: 0;">Regina Alejandra</h2>
    
    <div class="divider"></div>

    <div id="info-invitado">
      <p class="guest-name" id="nombre-display">Cargando invitación...</p>
      <p class="guest-passes" id="pases-display"></p>
    </div>

    <div class="divider"></div>

    <!-- Sección de Confirmación (Se actualiza dinámicamente) -->
    <div id="seccion-confirmacion">
      <p class="loading-text">Verificando estado de asistencia...</p>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTA URL CON LA QUE TE DIO APPS SCRIPT AL IMPLEMENTAR TU GOOGLE SHEET
    const SCRIPT_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const nombreInvitado = urlParams.get('nombre') || 'Invitado Especial';
      const invitadosCount = urlParams.get('invitados') || '1';

      // Mostrar datos en pantalla
      document.getElementById('nombre-display').innerText = nombreInvitado;
      document.getElementById('pases-display').innerText = `Lugares reservados: ${invitadosCount}`;

      if (!SCRIPT_URL.includes("TU_SCRIPT_ID")) {
        // Consultar el estado en Google Sheets
        try {
          const response = await fetch(`${SCRIPT_URL}?action=verificar&nombre=${encodeURIComponent(nombreInvitado)}`);
          const data = await response.json();

          if (data.yaRespondio) {
            bloquearFormulario(data.estado, nombreInvitado);
          } else {
            mostrarBotonesConfirmacion(nombreInvitado, invitadosCount);
          }
        } catch (error) {
          console.error("Error al verificar asistencia:", error);
          mostrarBotonesConfirmacion(nombreInvitado, invitadosCount);
        }
      } else {
        // Si aún no has puesto el SCRIPT_URL, muestra los botones normalmente
        mostrarBotonesConfirmacion(nombreInvitado, invitadosCount);
      }
    });

    // Muestra los botones si la persona no ha respondido
    function mostrarBotonesConfirmacion(nombre, pases) {
      const contenedor = document.getElementById('seccion-confirmacion');
      contenedor.innerHTML = `
        <p style="font-weight: 500; margin-bottom: 12px;">¿Nos acompañarás en este día tan especial?</p>
        <div class="btn-container">
          <button class="btn-confirm" onclick="responderAsistencia('Confirmado', '${pases}')">✨ Confirmar Asistencia</button>
          <button class="btn-decline" onclick="responderAsistencia('Rechazado', 0)">No podré asistir</button>
        </div>
      `;
    }

    // Registra la respuesta en Google Sheets y bloquea los botones
    async function responderAsistencia(estado, pases) {
      const urlParams = new URLSearchParams(window.location.search);
      const nombreInvitado = urlParams.get('nombre') || 'Invitado Especial';
      const contenedor = document.getElementById('seccion-confirmacion');

      contenedor.innerHTML = `<p class="loading-text">Guardando tu respuesta...</p>`;

      try {
        if (!SCRIPT_URL.includes("TU_SCRIPT_ID")) {
          await fetch(`${SCRIPT_URL}?action=confirmar&nombre=${encodeURIComponent(nombreInvitado)}&estado=${encodeURIComponent(estado)}&asistentes=${pases}`);
        }
        bloquearFormulario(estado, nombreInvitado);
      } catch (error) {
        alert("Ocurrió un error al guardar tu respuesta. Por favor intenta nuevamente.");
        mostrarBotonesConfirmacion(nombreInvitado, pases);
      }
    }

    // Cambia la vista de la invitación cuando ya fue respondida
    function bloquearFormulario(estado, nombre) {
      const contenedor = document.getElementById('seccion-confirmacion');
      const esConfirmado = estado.toLowerCase().includes('confirmado');

      if (esConfirmado) {
        contenedor.innerHTML = `
          <div class="status-card status-confirmed">
            <h3 style="margin-top: 0; margin-bottom: 6px;">✨ ¡Asistencia Registrada! ✨</h3>
            <p style="margin: 0;">La confirmación para <strong>${nombre}</strong> ya se encuentra guardada.</p>
          </div>
        `;
      } else {
        contenedor.innerHTML = `
          <div class="status-card status-declined">
            <h3 style="margin-top: 0; margin-bottom: 6px;">Respuesta Registrada</h3>
            <p style="margin: 0;">Ya se había registrado previamente que <strong>${nombre}</strong> no podrá asistir.</p>
          </div>
        `;
      }
    }
  </script>

</body>
</html>
